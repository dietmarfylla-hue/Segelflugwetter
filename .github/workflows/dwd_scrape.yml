name: DWD 3-Tage-Prognose Nord

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Output-Verzeichnis leeren
        run: |
          mkdir -p output
          rm -f output/*

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Chrome installieren
        uses: browser-actions/setup-chrome@v1

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: DWD-Skript ausführen
        run: python dwd_extract.py

      - name: Thermalmap-Skript ausführen
        run: python thermalmap_extract.py

      - name: Ergebnis committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/
          git diff --staged --quiet || git commit -m "DWD & Thermalmap Prognose aktualisiert"
          git push
