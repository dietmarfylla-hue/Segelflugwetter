name: Wolfsaap Segelflug-Wetterdaten

on:
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Berlin"

  workflow_dispatch: {}

permissions:
  contents: write

# Verhindert parallele Wetterläufe
concurrency:
  group: wolfsaap-wetterdaten
  cancel-in-progress: false

jobs:

  scrape:

    runs-on: ubuntu-latest

    # Sicherheitsgrenze
    timeout-minutes: 30

    steps:

      # ==========================================================
      # Repository
      # ==========================================================

      - name: Repo auschecken
        uses: actions/checkout@v4


      # ==========================================================
      # Output-Verzeichnis
      # ==========================================================

      - name: Output-Verzeichnis leeren
        run: |
          mkdir -p output
          rm -f output/*


      # ==========================================================
      # Python
      # ==========================================================

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==========================================================
      # Chrome für Selenium / Thermalmap
      # ==========================================================

      - name: Chrome installieren
        uses: browser-actions/setup-chrome@v1


      # ==========================================================
      # Python-Abhängigkeiten
      # ==========================================================

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # ==========================================================
      # 1. DWD Nord
      # ==========================================================

      - name: DWD-Skript ausführen (Nord, 3-Tage)
        run: |
          python dwd_extract.py


      # ==========================================================
      # 2. Wolfsaap zusätzliche Wetterdaten
      # ==========================================================

      - name: Wolfsaap Wetter weitere Daten ausführen (3-Tage)
        run: |
          python wolfsaap_wetter2.py


      # ==========================================================
      # 3. Thermalmap
      # ==========================================================

      - name: Thermalmap-Skript ausführen
        run: |
          python thermalmap_extract.py


      # ==========================================================
      # 4. DWD Gebiet 31
      # ==========================================================

      - name: DWD-Skript ausführen (Gebiet 31)
        run: |
          python dwd_gebiet31_extract.py


      # ==========================================================
      # 5. DWD Gebiet 34
      # ==========================================================

      - name: DWD-Skript ausführen (Gebiet 34)
        run: |
          python dwd_gebiet34_extract.py


      # ==========================================================
      # 6. DWD Gebiet 35
      # ==========================================================

      - name: DWD-Skript ausführen (Gebiet 35)
        run: |
          python dwd_gebiet35_extract.py


      # ==========================================================
      # 7. DWD Gebiet 36
      # ==========================================================

      - name: DWD-Skript ausführen (Gebiet 36)
        run: |
          python dwd_gebiet36_extract.py


      # ==========================================================
      # Ergebnisse anzeigen
      # ==========================================================

      - name: Erzeugte Dateien anzeigen
        run: |
          echo "======================================"
          echo "Erzeugte Dateien:"
          echo "======================================"

          ls -lah output/

          echo
          echo "TXT-Dateien:"

          find output \
            -maxdepth 1 \
            -type f \
            -name "*.txt" \
            -print


      # ==========================================================
      # Vollständigkeit kontrollieren
      # ==========================================================

      - name: Vollständigkeit prüfen
        run: |

          COUNT=$(find output \
            -maxdepth 1 \
            -type f \
            -name "*.txt" \
            | wc -l)

          echo "Gefundene TXT-Dateien: $COUNT"
          echo "Erwartete TXT-Dateien: mindestens 7"

          if [ "$COUNT" -lt 7 ]; then

            echo
            echo "FEHLER:"
            echo "Es wurden weniger als 7 Wetterdateien erzeugt."
            echo
            echo "Die Ergebnisse werden NICHT committed."

            exit 1

          fi

          echo
          echo "Vollständigkeitsprüfung erfolgreich."


      # ==========================================================
      # Ergebnisse committen
      # ==========================================================

      - name: Ergebnis committen
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "github-actions[bot]@users.noreply.github.com"

          git add -A output/

          if git diff --staged --quiet; then

            echo "Keine Änderungen vorhanden."

          else

            git commit \
              -m "Wolfsaap Wetterdaten aktualisiert"

            git push

          fi
